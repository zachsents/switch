[package]
name = "switch-gpui-base"
version = "0.1.0"
edition = "2024"
publish = false

# What a hot patch never replaces (lib.rs): the app's Objective-C classes and the state that
# outlives a patch.
[lib]
name = "base"
path = "src/lib.rs"

[dependencies]
block2.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true
objc2-user-notifications.workspace = true
objc2-web-kit.workspace = true
raw-window-handle.workspace = true
serde_json.workspace = true
url.workspace = true

[features]
# What the app's `shot` feature takes from here: Copy sent to a page.
shot = []
