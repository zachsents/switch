[package]
name = "switch-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "switch-gpui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csscolorparser = "0.7"
dirs = "6"
env_logger = "0.11"
futures = "0.3"
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4" }
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
indexmap = "2"
# test-support: the window's picture drawn by the app (`Window::render_to_image`), which the desktop
# extension's screenshot tool and `--features shot` take.
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4", features = ["font-kit", "test-support"] }
glam = "0.34"
gltf = { version = "1.4", default-features = false, features = ["import", "utils"] }
log = "0.4"
lru = "0.16"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSAppearance", "NSView", "NSMenu", "NSMenuItem", "NSEvent", "NSApplication", "NSColor", "NSColorPanel", "NSColorSpace", "NSPanel", "NSWindow", "NSGraphics", "NSRunningApplication", "NSWorkspace", "NSButton", "NSControl", "NSScreen", "block2", "objc2-core-foundation", "NSAccessibility", "NSPasteboard", "NSPasteboardItem", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSKeyValueCoding", "NSValue", "NSObject", "NSURL", "NSURLRequest", "NSError", "NSArray", "NSUserDefaults", "NSDate", "NSDateFormatter", "NSFormatter", "NSLocale", "NSNumberFormatter", "NSData"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKUserScript", "WKNavigation", "WKScriptMessage", "WKScriptMessageHandler", "WKFrameInfo", "WKNavigationDelegate", "WKNavigationAction", "WKUIDelegate", "WKSecurityOrigin", "WKContentRuleList", "WKContentRuleListStore", "WKWebsiteDataStore", "WKPreferences", "block2", "objc2-app-kit", "objc2-core-foundation"] }
rand = "0.9"
# Platform (src/platform): notifications, idle time, the extension's MCP, sign-in's loopback, files.
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEventSource", "CGEventTypes", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGColor"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false }
rmcp = { version = "3", default-features = false, features = ["server"] }
sha2 = "0.10"
tiny_http = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVVideoSettings", "objc2-core-foundation", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBase", "CMTime"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
raw-window-handle = "0.6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex-lite = "0.1"
fancy-regex = "0.14"
html5ever = "0.35"
jsonschema = { version = "0.30", default-features = false }
jmespath = "0.5"
sys-locale = "0.3"
# Compact figures in the locale, as Intl writes them (`notation: "compact"`): ICU4X, already under
# ui-sdk-number.
icu_decimal = { version = "2.4", features = ["unstable"] }
icu_locale_core = "2.4"
fixed_decimal = "0.7"
base64 = "0.22"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled", "collation"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = "0.41"
stl_io = "0.11"
tobj = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
# wss cores: rustls, with this Mac's trusted roots.
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ui-sdk = { git = "https://github.com/zachsents/ui-sdk-gpui", tag = "v0.3.0" }
url = "2"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
linkify = "0.10"
ammonia = "4"
scraper = "0.24"
ego-tree = "0.10"
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl", "std", "parking_lot"] }
global-hotkey = "0.10"

[build-dependencies]
cc = "1"

[features]
# Saves the window's frames as pictures ($SWITCH_GPUI_SHOT), for looking at the app where the screen
# can't be captured.
shot = []

# The app is a crate of its own, outside the TypeScript workspace.
[workspace]

# Zed's dev profile (ui-sdk-gpui's README): gpui's layout engine and proc macros
# are too slow unoptimized.
[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

[profile.dev.package]
# Dependencies carry no debug info: one shared target for every worktree stays a few GB.
"*" = { debug = false }
gpui_macros = { opt-level = 3 }
derive_refineable = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }

[profile.release]
debug = false
strip = true
