[package]
name = "recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui.workspace = true
kit.workspace = true
ai = { path = "../ai" }
objc2 = "0.6"
block2 = "0.6"
futures = "0.3"
serde_json = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "objc2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSDictionary", "NSError", "NSURL", "NSValue", "NSObject", "NSData", "NSDate", "NSFileManager", "NSPathUtilities", "NSRunLoop"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFArray", "CFDictionary"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGWindow", "CGDirectDisplay", "CGImage", "CGColorSpace", "CGDisplayStream"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMBase", "CMTime", "CMSampleBuffer", "CMFormatDescription", "CMBlockBuffer", "CMSync", "objc2-core-video", "objc2-core-audio-types"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "objc2-av-foundation", "SCShareableContent", "SCStream", "SCRecordingOutput", "SCContentSharingPicker", "SCError", "SCScreenshotManager"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-media", "AVMediaFormat", "AVVideoSettings", "AVAssetWriter", "AVAssetWriterInput", "AVAsset", "AVAssetTrack", "AVAssetReader", "AVAssetReaderOutput", "AVCaptureDevice", "AVMediaSelectionGroup", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAssetImageGenerator", "objc2-core-video", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSettings"] }
mp3lame-encoder = "0.2.5"
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = ["std"] }
jiff = "0.2"
tray-icon = "0.26"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSFont", "NSButton", "NSControl", "NSView", "NSResponder", "NSStatusItem", "NSStatusBarButton"] }
imaging = { version = "0.1.0", path = "../imaging" }
image = "0.25"
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase"] }

# Read by `cargo xtask bundle recorder`.
[package.metadata.bundle]
name = "Recorder"
icon = "record"
microphone = "Recorder records your voice alongside the screen, so meetings and walkthroughs have both sides."
screen_capture = "Recorder records the screen or a window you choose."
minimum_macos = "15.0"
