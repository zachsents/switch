[package]
name = "imaging"
version = "0.1.0"
edition = "2024"

[dependencies]
fast_image_resize = { version = "6", features = ["image"] }
image = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFDictionary", "CFString", "CFNumber", "CFAttributedString", "CFArray", "CFURL", "CFBase"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGColorSpace", "CGDataProvider", "CGBitmapContext", "CGContext", "CGPath", "CGColor", "CGAffineTransform"] }
objc2-core-image = { version = "0.3", default-features = false, features = ["std", "CIImage", "CIFilter", "CIContext", "CIVector", "CIColor", "CIFilterBuiltins", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFont", "CTLine", "CTFrame", "CTFramesetter", "CTStringAttributes", "CTFontDescriptor", "objc2-core-graphics"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSURL", "NSError", "NSFileManager", "NSPathUtilities", "NSArray", "NSDictionary", "NSValue", "NSKeyValueCoding", "NSIndexSet", "NSObject", "NSEnumerator"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-core-graphics", "CGImageSource", "CGImageDestination", "CGImageProperties", "CGImageMetadata"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNObservation", "VNGenerateForegroundInstanceMaskRequest", "objc2-core-graphics", "objc2-core-video", "objc2-core-image"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
webp = "0.3"
