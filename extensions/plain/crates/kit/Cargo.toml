[package]
name = "kit"
version = "0.1.0"
edition = "2024"

[dependencies]
ai = { version = "0.1.0", path = "../ai" }
base64 = "0.22"
dirs = "7.0.0"
futures = "0.3.34"
gpui.workspace = true
gpui_platform.workspace = true
jiff = "0.2.38"
raw-window-handle = "0.6"
resvg = { version = "0.46", default-features = false }
rust-embed = "8.13.0"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
unicode-segmentation = "1.13.3"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSound", "NSWindow", "NSApplication", "NSResponder", "NSView"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFURL", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSError"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "CGImageDestination"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager"] }
