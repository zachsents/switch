# Secrets for iPhone and its AutoFill extension, made by XcodeGen (`xcodegen` here; ios/build.sh runs
# it). Team, bundle ids, the app group, the shared keychain group and the core's address come from
# the build (ios/build.sh), never the source.
name: Secrets
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    APP_BUNDLE_ID: dev.local.switch.secrets
    # Shared by the app and its extension: the encrypted cache, and the device's key.
    APP_GROUP: group.$(APP_BUNDLE_ID)
    KEYCHAIN_GROUP: $(APP_BUNDLE_ID).shared
    # The core, ws://host:port, given at build time (ios/build.sh).
    SWITCH_CORE: ""
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Secrets:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - target: AutoFill
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Secrets
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Secrets.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Secrets
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: To reach Switch over your network.
        INFOPLIST_KEY_NSFaceIDUsageDescription: To open the vault.
  AutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoFill
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - sdk: AuthenticationServices.framework
    settings:
      base:
        PRODUCT_NAME: SecretsAutoFill
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).autofill
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: AutoFill/Info.plist
        CODE_SIGN_ENTITLEMENTS: AutoFill/AutoFill.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Secrets
        INFOPLIST_KEY_NSFaceIDUsageDescription: To open the vault.
        APPLICATION_EXTENSION_API_ONLY: YES
